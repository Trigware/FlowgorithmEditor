<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/style.css">
    <title>Flowgorithm Online Editor</title>
</head>
<body id="DocumentBody">
    <div class="HeaderSection" id="HeaderSection">
        <label>
            <input type="file" accept=".fprg" id="OpenFileInput" hidden>
            <img src="Assets/OpenFile.png">
        </label>
    </div>
    <div class="ShapePlane" id="ShapePlane"></div>
    <div class="AbsolutePlane">
        <div class="SelectionBox" id="SelectionBox"></div>
    </div>
    <script type="module" src="Scripts/JS/Utils.js"></script>
    <script type="module" src="Scripts/JS/ProgramRepresentation.js"></script>
    <script type="module" src="Scripts/JS/ProgramParser.js"></script>
    <script type="module" src="Scripts/JS/ShapePlane.js"></script>
    <script type="module" src="Scripts/JS/ShapeSelect.js"></script>
</body>
</html>
